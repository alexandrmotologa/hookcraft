<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="beak-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="eye-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>

    <filter id="eye-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Precision Dashed Ring -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Corner Accent Bolts -->
      <circle cx="0" cy="-390" r="8" fill="#00f5ff" />
      <circle cx="338" cy="-195" r="8" fill="#00f5ff" />
      <circle cx="338" cy="195" r="8" fill="#00f5ff" />
      <circle cx="0" cy="390" r="8" fill="#00f5ff" />
      <circle cx="-338" cy="195" r="8" fill="#00f5ff" />
      <circle cx="-338" cy="-195" r="8" fill="#00f5ff" />

      <!-- ======================================================== -->
      <!-- 100% Watertight Solid Base Silhouette (The Peregrine Falcon) -->
      <!-- ======================================================== -->
      <path d="
        M 0,-290
        L 65,-275
        L 125,-220
        L 155,-160
        L 210,-110
        L 275,-30
        L 295,70
        L 280,150
        L 225,230
        L 160,285
        L 85,325
        L 0,345
        L -85,325
        L -160,285
        L -225,230
        L -280,150
        L -295,70
        L -275,-30
        L -210,-110
        L -155,-160
        L -125,-220
        L -65,-275
        Z
      " fill="#0b0f19" />

      <!-- ======================================================== -->
      <!-- Low-Poly Mantle & Outer Wing Panels (Symmetrical)       -->
      <!-- ======================================================== -->
      <!-- Outer Wing Left -->
      <polygon points="-210,-110 -275,-30 -295,70 -205,40 -160,-20" fill="#1e293b" />
      <polygon points="-295,70 -280,150 -225,230 -185,160 -205,40" fill="#0f172a" />
      <polygon points="-225,230 -160,285 -115,220 -185,160" fill="#1e293b" />
      <polygon points="-160,285 -85,325 0,345 -45,260 -115,220" fill="#0f172a" />

      <!-- Outer Wing Right -->
      <polygon points="210,-110 275,-30 295,70 205,40 160,-20" fill="#334155" />
      <polygon points="295,70 280,150 225,230 185,160 205,40" fill="#1e293b" />
      <polygon points="225,230 160,285 115,220 185,160" fill="#334155" />
      <polygon points="160,285 85,325 0,345 45,260 115,220" fill="#1e293b" />

      <!-- Shoulder Plates Left -->
      <polygon points="-155,-160 -210,-110 -160,-20 -115,-90" fill="#334155" />
      <polygon points="-160,-20 -205,40 -185,160 -115,100" fill="#1e293b" />
      <polygon points="-115,-90 -160,-20 -115,100 -70,-10" fill="#475569" />

      <!-- Shoulder Plates Right -->
      <polygon points="155,-160 210,-110 160,-20 115,-90" fill="#475569" />
      <polygon points="160,-20 205,40 185,160 115,100" fill="#334155" />
      <polygon points="115,-90 160,-20 115,100 70,-10" fill="#64748b" />

      <!-- ======================================================== -->
      <!-- Central Body & Shield Keel                               -->
      <!-- ======================================================== -->
      <!-- Lower Sternum / Abdomen -->
      <polygon points="0,345 -45,260 0,210" fill="#1e293b" />
      <polygon points="0,345 45,260 0,210" fill="#334155" />
      <polygon points="-45,260 -115,220 -80,150 0,165" fill="#1e293b" />
      <polygon points="45,260 115,220 80,150 0,165" fill="#334155" />
      <polygon points="0,210 -45,260 0,165" fill="#0f172a" />
      <polygon points="0,210 45,260 0,165" fill="#1e293b" />

      <!-- Chest Keel Plates -->
      <polygon points="0,165 -80,150 -60,70 0,85" fill="#334155" />
      <polygon points="0,165 80,150 60,70 0,85" fill="#475569" />
      <polygon points="-80,150 -115,100 -70,-10 -60,70" fill="#1e293b" />
      <polygon points="80,150 115,100 70,-10 60,70" fill="#334155" />

      <polygon points="0,85 -60,70 -50,-10 0,0" fill="#475569" />
      <polygon points="0,85 60,70 50,-10 0,0" fill="#64748b" />
      <polygon points="-60,70 -70,-10 -50,-10" fill="#334155" />
      <polygon points="60,70 70,-10 50,-10" fill="#475569" />

      <!-- Upper Chest & Throat Armor -->
      <polygon points="0,0 -50,-10 -40,-80 0,-60" fill="#64748b" />
      <polygon points="0,0 50,-10 40,-80 0,-60" fill="#94a3b8" />
      <polygon points="-50,-10 -115,-90 -85,-110 -40,-80" fill="#334155" />
      <polygon points="50,-10 115,-90 85,-110 40,-80" fill="#475569" />

      <!-- ======================================================== -->
      <!-- Falcon Craniofacial Architecture & Crown                 -->
      <!-- ======================================================== -->
      <!-- Forehead & Crown Ridge -->
      <polygon points="0,-290 -65,-275 -45,-215 0,-230" fill="#1e293b" />
      <polygon points="0,-290 65,-275 45,-215 0,-230" fill="#334155" />
      <polygon points="-65,-275 -125,-220 -85,-175 -45,-215" fill="#0f172a" />
      <polygon points="65,-275 125,-220 85,-175 45,-215" fill="#1e293b" />
      <polygon points="-125,-220 -155,-160 -110,-140 -85,-175" fill="#1e293b" />
      <polygon points="125,-220 155,-160 110,-140 85,-175" fill="#334155" />

      <!-- Center Brow to Cere -->
      <polygon points="0,-230 -45,-215 -35,-165 0,-175" fill="#334155" />
      <polygon points="0,-230 45,-215 35,-165 0,-175" fill="#475569" />

      <!-- Falcon Malar / Tear Stripe (Signature Low-Poly Cheek) -->
      <polygon points="-85,-175 -110,-140 -75,-105 -55,-135" fill="#0b0f19" />
      <polygon points="85,-175 110,-140 75,-105 55,-135" fill="#0f172a" />
      <polygon points="-110,-140 -115,-90 -75,-105" fill="#0b0f19" />
      <polygon points="110,-140 115,-90 75,-105" fill="#0f172a" />

      <!-- Throat Base -->
      <polygon points="0,-60 -40,-80 -25,-120 0,-110" fill="#94a3b8" />
      <polygon points="0,-60 40,-80 25,-120 0,-110" fill="#cbd5e1" />
      <polygon points="-40,-80 -75,-105 -55,-135 -25,-120" fill="#475569" />
      <polygon points="40,-80 75,-105 55,-135 25,-120" fill="#64748b" />

      <!-- ======================================================== -->
      <!-- The Raptor Beak (The Hook)                               -->
      <!-- ======================================================== -->
      <!-- Beak Upper Cere -->
      <polygon points="0,-175 -35,-165 -25,-120 0,-130" fill="#0284c7" />
      <polygon points="0,-175 35,-165 25,-120 0,-130" fill="#0ea5e9" />

      <!-- Powerful Hook Beak -->
      <polygon points="0,-130 -25,-120 -20,-85 0,-55" fill="url(#beak-cyan)" />
      <polygon points="0,-130 25,-120 20,-85 0,-55" fill="#38bdf8" />
      <polygon points="0,-55 -20,-85 -10,-45 0,-30" fill="#0369a1" />
      <polygon points="0,-55 20,-85 10,-45 0,-30" fill="#0ea5e9" />
      <!-- Sharp Hook Tip descending down -->
      <polygon points="0,-30 -10,-45 0,-12" fill="#0284c7" />
      <polygon points="0,-30 10,-45 0,-12" fill="#38bdf8" />

      <!-- ======================================================== -->
      <!-- Predator Gaze: Almond Electric Cyan Optics               -->
      <!-- ======================================================== -->
      <!-- Eye Socket Left -->
      <polygon points="-35,-165 -85,-175 -55,-135" fill="#0b0f19" />
      <!-- Eye Almond Left -->
      <polygon points="-42,-160 -78,-168 -56,-144" fill="url(#eye-glow)" filter="url(#eye-bloom)" />
      <polygon points="-52,-158 -66,-162 -57,-150" fill="#090d16" />

      <!-- Eye Socket Right -->
      <polygon points="35,-165 85,-175 55,-135" fill="#0f172a" />
      <!-- Eye Almond Right -->
      <polygon points="42,-160 78,-168 56,-144" fill="url(#eye-glow)" filter="url(#eye-bloom)" />
      <polygon points="52,-158 66,-162 57,-150" fill="#090d16" />

      <!-- ======================================================== -->
      <!-- Precision Engineering Trim Lines (Electric Cyan Seams)    -->
      <!-- ======================================================== -->
      <!-- Keel Centerline Line -->
      <line x1="0" y1="0" x2="0" y2="345" stroke="#00f5ff" stroke-width="3" opacity="0.8" />
      
      <!-- Crown to Cere Centerline -->
      <line x1="0" y1="-290" x2="0" y2="-175" stroke="#00f5ff" stroke-width="2.5" opacity="0.6" />

      <!-- Wing Leading Edge Energy Traces -->
      <line x1="-155" y1="-160" x2="-295" y2="70" stroke="#00f5ff" stroke-width="2" opacity="0.5" stroke-dasharray="10, 6" />
      <line x1="155" y1="-160" x2="295" y2="70" stroke="#00f5ff" stroke-width="2" opacity="0.5" stroke-dasharray="10, 6" />

      <!-- Chest Keel Node Indicator -->
      <circle cx="0" cy="85" r="4.5" fill="#00f5ff" />
      <circle cx="0" cy="210" r="3.5" fill="#00f5ff" />

    </g>
  </g>
</svg>